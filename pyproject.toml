[project]
name = "sd-comic-lettering"
description = "Letters generated images: fills the speech bubbles in the art, adds captions and sound effects, and lets you place bubbles of your own in a visual editor."
version = "1.2.0"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "Pillow>=9.2"]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/KazeKaze93/sd-comic-lettering"
Documentation = "https://github.com/KazeKaze93/sd-comic-lettering#readme"
"Bug Tracker" = "https://github.com/KazeKaze93/sd-comic-lettering/issues"

[tool.comfy]
PublisherId = "kaze"
DisplayName = "Comic Lettering"
